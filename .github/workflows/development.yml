name: Development

on:
  push:
    branches: [ "development" ]

permissions:
  contents: read

jobs:
  composer:
    runs-on: ubuntu-latest
    steps:
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl
          tools: composer
      - uses: actions/checkout@v7
      - name: Cache vendor folder
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ github.sha }}-composer
      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress
  phpstan84:
    runs-on: ubuntu-latest
    needs: [ composer ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl
          tools: composer
      - name: Retrieve cached vendor folder
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ github.sha }}-composer
      - run: ./vendor/bin/phpstan analyse -c phpstan.neon --memory-limit 200M
  phpcs84:
    runs-on: ubuntu-latest
    needs: [ composer ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl
          tools: composer
      - name: Retrieve cached vendor folder
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ github.sha }}-composer
      - run: ./vendor/bin/phpcs --standard=./phpcs.xml
  phpunit84:
    runs-on: ubuntu-latest
    needs: [ composer ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl
          tools: composer
      - name: Retrieve cached vendor folder
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ github.sha }}-composer
      - run: ./vendor/bin/phpunit -c phpunit.xml --do-not-cache-result
  psalm84:
    runs-on: ubuntu-latest
    needs: [ composer ]
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: intl
          tools: composer
      - name: Retrieve cached vendor folder
        uses: actions/cache@v6
        with:
          path: vendor
          key: ${{ github.sha }}-composer
      - run: ./vendor/bin/psalm
